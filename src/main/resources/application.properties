spring.application.name=url-shortener
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${POSTGRES_DB:url_shortener}
spring.datasource.username=${POSTGRES_USER:url_shortener}
spring.datasource.password=${POSTGRES_PASSWORD:local_password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false
